name: Temporary oracle branch source snapshot

on:
  push:
    branches:
      - agent/original-save-oracle-harness
    paths:
      - .github/workflows/temporary-oracle-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout oracle branch
        uses: actions/checkout@v6
        with:
          ref: agent/original-save-oracle-harness

      - name: Archive exact branch source
        run: git archive --format=tar.gz --output=civ3-oracle-branch-source.tar.gz HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: civ3-oracle-branch-source
          path: civ3-oracle-branch-source.tar.gz
          if-no-files-found: error
          retention-days: 1
