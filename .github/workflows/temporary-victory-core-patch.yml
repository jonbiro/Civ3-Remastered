name: Temporary victory outcome core patch

on:
  push:
    branches:
      - agent/victory-outcome-core
    paths:
      - .github/workflows/temporary-victory-core-patch.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/victory-outcome-core
          fetch-depth: 0

      - name: Apply victory state and import edits
        shell: python
        run: |
          from pathlib import Path

          import_path = Path("C7Engine/C7GameData/ImportCiv3.cs")
          source = import_path.read_text()
          old = '''\t\t\tGAME game = biq.Game[0];
          \t\t\tsave.Rules.AllowCulturalVictory = game.CulturalVictory;
          \t\t\tsave.Rules.OneCityCultureWin = game.OneCityCultureWin;
          \t\t\tsave.Rules.AllCitiesCultureWin = game.AllCitiesCultureWin;
          '''
          new = '''\t\t\tGAME game = biq.Game[0];
          \t\t\tsave.Rules.AllowCulturalVictory = game.CulturalVictory;
          \t\t\tsave.Rules.OneCityCultureWin = game.OneCityCultureWin;
          \t\t\tsave.Rules.AllCitiesCultureWin = game.AllCitiesCultureWin;
          \t\t\tsave.Rules.AllowConquestVictory = game.ConquestVictory;
          \t\t\tsave.Rules.AllowDominationVictory = game.DominationVictory;
          \t\t\tsave.Rules.DominationTerrainPercent = game.DominationTerrain;
          \t\t\tsave.Rules.DominationPopulationPercent = game.DominationPopulation;
          '''
          if old not in source:
              raise SystemExit("Expected culture victory import block not found")
          import_path.write_text(source.replace(old, new, 1))

          data_path = Path("C7Engine/C7GameData/GameData.cs")
          source = data_path.read_text()
          old = '''\t\tpublic Rules rules;
          \t\tpublic TimeOptions timeOptions;
          '''
          new = '''\t\tpublic Rules rules;
          \t\tpublic TimeOptions timeOptions;
          \t\tpublic GameOutcome outcome;
          '''
          if old not in source:
              raise SystemExit("Expected GameData rules/time block not found")
          data_path.write_text(source.replace(old, new, 1))

          save_path = Path("C7Engine/C7GameData/Save/SaveGame.cs")
          source = save_path.read_text()
          replacements = [
              (
                  '''\t\t\t\tTimeOptions = data.timeOptions,
                  \t\t\t\tTerrainImprovements = data.terrainImprovements.ConvertAll(ti => ti.ToSaveTerrainImprovement()),
                  ''',
                  '''\t\t\t\tTimeOptions = data.timeOptions,
                  \t\t\t\tOutcome = data.outcome,
                  \t\t\t\tTerrainImprovements = data.terrainImprovements.ConvertAll(ti => ti.ToSaveTerrainImprovement()),
                  '''
              ),
              (
                  '''\t\t\t\ttimeOptions = TimeOptions,
                  \t\t\t\tGreatWondersBuilt = GreatWondersBuilt,
                  ''',
                  '''\t\t\t\ttimeOptions = TimeOptions,
                  \t\t\t\toutcome = Outcome,
                  \t\t\t\tGreatWondersBuilt = GreatWondersBuilt,
                  '''
              ),
              (
                  '''\t\tpublic Rules Rules = new();
                  \t\tpublic TimeOptions TimeOptions = new();
                  ''',
                  '''\t\tpublic Rules Rules = new();
                  \t\tpublic TimeOptions TimeOptions = new();
                  \t\tpublic GameOutcome Outcome;
                  '''
              ),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit("Expected SaveGame persistence block not found")
              source = source.replace(old, new, 1)
          save_path.write_text(source)

      - name: Commit and self-remove
        run: |
          git rm .github/workflows/temporary-victory-core-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add C7Engine/C7GameData/ImportCiv3.cs C7Engine/C7GameData/GameData.cs C7Engine/C7GameData/Save/SaveGame.cs
          git commit -m "Import victory rules and persist game outcomes"
          git push origin HEAD:agent/victory-outcome-core
