name: Temporary victory outcome core patch

on:
  push:
    branches:
      - agent/victory-outcome-core
    paths:
      - .github/workflows/temporary-victory-core-patch.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/victory-outcome-core
          fetch-depth: 0

      - name: Apply victory state and import edits
        shell: python
        run: |
          from pathlib import Path

          def insert_after(path, anchor, addition, label):
              source = path.read_text()
              if addition.strip() in source:
                  return
              if anchor not in source:
                  raise SystemExit(f"Expected {label} anchor not found")
              path.write_text(source.replace(anchor, anchor + addition, 1))

          import_path = Path("C7Engine/C7GameData/ImportCiv3.cs")
          insert_after(
              import_path,
              "\t\t\tsave.Rules.AllCitiesCultureWin = game.AllCitiesCultureWin;\n",
              "\t\t\tsave.Rules.AllowConquestVictory = game.ConquestVictory;\n"
              "\t\t\tsave.Rules.AllowDominationVictory = game.DominationVictory;\n"
              "\t\t\tsave.Rules.DominationTerrainPercent = game.DominationTerrain;\n"
              "\t\t\tsave.Rules.DominationPopulationPercent = game.DominationPopulation;\n",
              "ImportCiv3 cultural victory",
          )

          data_path = Path("C7Engine/C7GameData/GameData.cs")
          insert_after(
              data_path,
              "\t\tpublic TimeOptions timeOptions;\n",
              "\t\tpublic GameOutcome outcome;\n",
              "GameData TimeOptions",
          )

          save_path = Path("C7Engine/C7GameData/Save/SaveGame.cs")
          insert_after(
              save_path,
              "\t\t\t\tTimeOptions = data.timeOptions,\n",
              "\t\t\t\tOutcome = data.outcome,\n",
              "SaveGame FromGameData TimeOptions",
          )
          insert_after(
              save_path,
              "\t\t\t\ttimeOptions = TimeOptions,\n",
              "\t\t\t\toutcome = Outcome,\n",
              "SaveGame InitializeGameData TimeOptions",
          )
          insert_after(
              save_path,
              "\t\tpublic TimeOptions TimeOptions = new();\n",
              "\t\tpublic GameOutcome Outcome;\n",
              "SaveGame TimeOptions field",
          )

      - name: Commit and self-remove
        run: |
          git rm .github/workflows/temporary-victory-core-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add C7Engine/C7GameData/ImportCiv3.cs C7Engine/C7GameData/GameData.cs C7Engine/C7GameData/Save/SaveGame.cs
          git commit -m "Import victory rules and persist game outcomes"
          git push origin HEAD:agent/victory-outcome-core
