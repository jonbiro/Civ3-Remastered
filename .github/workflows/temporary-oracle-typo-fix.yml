name: Temporary oracle typo repair

on:
  push:
    branches:
      - agent/original-save-oracle-harness
    paths:
      - .github/workflows/temporary-oracle-typo-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout oracle branch
        uses: actions/checkout@v6
        with:
          ref: agent/original-save-oracle-harness
          fetch-depth: 0

      - name: Repair typo and remove temporary workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("EngineTests/Utils/Civ3OracleFixtures.cs")
          text = path.read_text()
          old = "\n\t\t\t);\nn\t\t}\n"
          new = "\n\t\t\t);\n\t\t}\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected one typo sequence, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/temporary-oracle-typo-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EngineTests/Utils/Civ3OracleFixtures.cs
          git commit -m "Repair oracle manifest validation typo"
          git push origin HEAD:agent/original-save-oracle-harness
