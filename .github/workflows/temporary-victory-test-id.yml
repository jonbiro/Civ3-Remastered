name: Temporary victory test ID fix

on:
  push:
    branches:
      - agent/victory-outcome-core
    paths:
      - .github/workflows/temporary-victory-test-id.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/victory-outcome-core
          fetch-depth: 0
      - name: Use a serializable generated ID in the save round-trip test
        shell: python
        run: |
          from pathlib import Path
          path = Path("EngineTests/Compatibility/VictoryOutcomeCompatibilityTest.cs")
          source = path.read_text()
          anchor = '''\tpublic void OutcomeSurvivesNativeSaveJsonClone() {
          \t\tID winner = ID.None("winner");
          '''
          replacement = '''\tpublic void OutcomeSurvivesNativeSaveJsonClone() {
          \t\tID.Factory ids = new();
          \t\tID winner = ids.CreateID("player");
          '''
          if anchor not in source:
              raise SystemExit("Expected persistence test anchor not found")
          path.write_text(source.replace(anchor, replacement, 1))
      - name: Commit and self-remove
        run: |
          git rm .github/workflows/temporary-victory-test-id.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EngineTests/Compatibility/VictoryOutcomeCompatibilityTest.cs
          git commit -m "Use generated ID in victory save round-trip test"
          git push origin HEAD:agent/victory-outcome-core
