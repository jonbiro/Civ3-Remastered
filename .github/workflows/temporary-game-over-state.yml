name: Temporary game-over state implementation

on:
  push:
    branches:
      - agent/game-over-state
    paths:
      - .github/workflows/temporary-game-over-state.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/game-over-state
          fetch-depth: 0

      - name: Apply engine and frontend game-over gating
        shell: python
        run: |
          from pathlib import Path

          def replace_one(path, old, new, label):
              source = path.read_text()
              if old not in source:
                  raise SystemExit(f"Expected {label} anchor not found in {path}")
              path.write_text(source.replace(old, new, 1))

          engine_msg = Path("C7Engine/EntryPoints/MessageToEngine.cs")
          replace_one(
              engine_msg,
              '''\tpublic abstract class MessageToEngine {
          \t\tpublic abstract void process();

          \t\tpublic void send() {
          \t\t\tEngineStorage.pendingMessages.Enqueue(this);
          \t\t}
          \t}
          ''',
              '''\tpublic abstract class MessageToEngine {
          \t\tpublic abstract void process();
          \t\tpublic virtual bool AllowedAfterGameOver => false;

          \t\tpublic bool send() {
          \t\t\tif (EngineStorage.gameData?.outcome?.HasClaims == true && !AllowedAfterGameOver) {
          \t\t\t\treturn false;
          \t\t\t}
          \t\t\tEngineStorage.pendingMessages.Enqueue(this);
          \t\t\treturn true;
          \t\t}
          \t}
          ''',
              "MessageToEngine send method",
          )
          replace_one(
              engine_msg,
              '''\tpublic class MsgShutdownEngine : MessageToEngine {
          \t\tprivate ILogger log = Log.ForContext<MsgShutdownEngine>();
          ''',
              '''\tpublic class MsgShutdownEngine : MessageToEngine {
          \t\tprivate ILogger log = Log.ForContext<MsgShutdownEngine>();
          \t\tpublic override bool AllowedAfterGameOver => true;
          ''',
              "shutdown message",
          )

          storage = Path("C7Engine/EngineStorage.cs")
          replace_one(
              storage,
              '''\t\t\t\tvar msg = pendingMessages.Dequeue();
          \t\t\t\tmsg.process();

          \t\t\t\tvar type = msg.GetType();
          ''',
              '''\t\t\t\tvar msg = pendingMessages.Dequeue();
          \t\t\t\tif (gameData?.outcome?.HasClaims == true && !msg.AllowedAfterGameOver) {
          \t\t\t\t\treturn;
          \t\t\t\t}
          \t\t\t\tmsg.process();

          \t\t\t\tvar type = msg.GetType();
          ''',
              "engine dequeue processing",
          )

          ui_msg = Path("C7Engine/EntryPoints/MessageToUI.cs")
          replace_one(
              ui_msg,
              '''\tpublic class MsgStartTurn : MessageToUI { }

          \tpublic class MsgShowScienceAdvisor : MessageToUI { }
          ''',
              '''\tpublic class MsgStartTurn : MessageToUI { }

          \tpublic class MsgGameOutcome : MessageToUI {
          \t\tpublic GameOutcome outcome;

          \t\tpublic MsgGameOutcome(GameOutcome outcome) {
          \t\t\tthis.outcome = outcome;
          \t\t}
          \t}

          \tpublic class MsgShowScienceAdvisor : MessageToUI { }
          ''',
              "MsgStartTurn",
          )

          turn = Path("C7Engine/EntryPoints/TurnHandling.cs")
          replace_one(
              turn,
              '''\t\t\t\tVictoryResolver.RecordAtTurnBoundary(gameData);

          \t\t\t\t// Now that the turn is ending, do all the bookkeeping for the
          ''',
              '''\t\t\t\tGameOutcome outcome = VictoryResolver.RecordAtTurnBoundary(gameData);
          \t\t\t\tif (outcome?.HasClaims == true) {
          \t\t\t\t\tnew MsgGameOutcome(outcome).send();
          \t\t\t\t\tstopwatch.Stop();
          \t\t\t\t\tlog.Information($"Game outcome recorded on turn {outcome.Turn}; stopping turn advancement");
          \t\t\t\t\treturn;
          \t\t\t\t}

          \t\t\t\t// Now that the turn is ending, do all the bookkeeping for the
          ''',
              "round-boundary outcome",
          )

          game = Path("C7/Game.cs")
          replace_one(
              game,
              '''\tpublic enum GameState {
          \t\tPlayerTurn,
          \t\tComputerTurn
          \t}
          ''',
              '''\tpublic enum GameState {
          \t\tPlayerTurn,
          \t\tComputerTurn,
          \t\tGameOver,
          \t}
          ''',
              "GameState enum",
          )
          replace_one(
              game,
              '''\t\tTurnHandling.OnBeginTurn();

          \t\tloadTimer.Stop();
          ''',
              '''\t\tTurnHandling.OnBeginTurn();
          \t\tif (EngineStorage.gameData.outcome?.HasClaims == true) {
          \t\t\tOnGameOutcome(EngineStorage.gameData.outcome);
          \t\t}

          \t\tloadTimer.Stop();
          ''',
              "StartGame outcome restore",
          )
          replace_one(
              game,
              '''\t\t\tcase MsgStartTurn mST:
          \t\t\t\tOnPlayerStartTurn();
          \t\t\t\tbreak;
          ''',
              '''\t\t\tcase MsgStartTurn mST:
          \t\t\t\tOnPlayerStartTurn();
          \t\t\t\tbreak;
          \t\t\tcase MsgGameOutcome mGO:
          \t\t\t\tOnGameOutcome(mGO.outcome);
          \t\t\t\tbreak;
          ''',
              "HandleEngineMessage start turn",
          )
          handle_anchor = '''\tpublic override void _Process(double delta) {
          '''
          handle_method = '''\tprivate void OnGameOutcome(GameOutcome outcome) {
          \t\tif (outcome?.HasClaims != true) return;

          \t\tCurrentState = GameState.GameOver;
          \t\tturnsLeftToFastForward = 0;
          \t\tSetGotoMode(false);
          \t\tsetBombard(null);

          \t\tstring message;
          \t\tif (outcome.IsResolved) {
          \t\t\tPlayer winner = EngineStorage.gameData.players.Find(player => player.id == outcome.WinnerId);
          \t\t\tstring civilizationName = winner?.civilization?.noun ?? "A civilization";
          \t\t\tstring victoryTypes = string.Join(", ", outcome.Claims.Select(claim => claim.Type.ToString()));
          \t\t\tmessage = winner == controller
          \t\t\t\t? $"Victory! The {civilizationName} have achieved {victoryTypes} victory. You may continue inspecting the map."
          \t\t\t\t: $"Game Over. The {civilizationName} have achieved {victoryTypes} victory. You may continue inspecting the map.";
          \t\t} else {
          \t\t\tmessage = "Game Over. Multiple civilizations reached victory conditions on the same turn. The simultaneous result has been preserved for compatibility review.";
          \t\t}

          \t\tpopupOverlay.ShowPopup(new InformationalPopup(message), PopupOverlay.PopupCategory.Info);
          \t}

          '''
          source = game.read_text()
          if "private void OnGameOutcome(GameOutcome outcome)" not in source:
              if handle_anchor not in source:
                  raise SystemExit("Expected Game._Process anchor not found")
              source = source.replace(handle_anchor, handle_method + handle_anchor, 1)
              game.write_text(source)

          replace_one(
              game,
              '''\tprivate void HandleMouseButtonInput(InputEventMouseButton eventMouseButton) {
          \t\tif (CurrentState == GameState.ComputerTurn) return;
          ''',
              '''\tprivate void HandleMouseButtonInput(InputEventMouseButton eventMouseButton) {
          \t\tif (CurrentState == GameState.ComputerTurn) return;
          \t\tif (CurrentState == GameState.GameOver) {
          \t\t\tif (eventMouseButton.ButtonIndex == MouseButton.Left) {
          \t\t\t\tHandleLeftMouseButton(eventMouseButton);
          \t\t\t} else if (eventMouseButton.ButtonIndex == MouseButton.Right && !eventMouseButton.IsPressed()) {
          \t\t\t\tTile tile = PositionToTile(eventMouseButton.Position);
          \t\t\t\tif (tile != null) ShowTileInfo(tile);
          \t\t\t} else if (eventMouseButton.ButtonIndex == MouseButton.WheelUp) {
          \t\t\t\tAdjustZoom(0.1f);
          \t\t\t} else if (eventMouseButton.ButtonIndex == MouseButton.WheelDown) {
          \t\t\t\tAdjustZoom(-0.1f);
          \t\t\t}
          \t\t\treturn;
          \t\t}
          ''',
              "mouse input state gate",
          )
          replace_one(
              game,
              '''\tprivate void HandleKeyboardInput(InputEventKey eventKeyDown) {
          \t\tif (eventKeyDown.Keycode == Godot.Key.O && eventKeyDown.ShiftPressed && eventKeyDown.IsCommandOrControlPressed() && eventKeyDown.AltPressed) {
          \t\t\tToggleObserverMode();
          \t\t}
          ''',
              '''\tprivate void HandleKeyboardInput(InputEventKey eventKeyDown) {
          \t\tif (CurrentState != GameState.GameOver
          \t\t\t&& eventKeyDown.Keycode == Godot.Key.O
          \t\t\t&& eventKeyDown.ShiftPressed
          \t\t\t&& eventKeyDown.IsCommandOrControlPressed()
          \t\t\t&& eventKeyDown.AltPressed) {
          \t\t\tToggleObserverMode();
          \t\t}
          ''',
              "observer shortcut",
          )
          replace_one(
              game,
              '''\t\t// never poll for actions if UI elements are visible
          \t\tif (HasVisibleModal()) {
          \t\t\treturn;
          \t\t}

          \t\tif (currentAction == C7Action.EndTurn && !this.HasCurrentlySelectedUnit()) {
          ''',
              '''\t\t// never poll for actions if UI elements are visible
          \t\tif (HasVisibleModal()) {
          \t\t\treturn;
          \t\t}

          \t\tif (CurrentState == GameState.GameOver && currentAction == C7Action.EndTurn) {
          \t\t\treturn;
          \t\t}

          \t\tif (currentAction == C7Action.EndTurn && !this.HasCurrentlySelectedUnit()) {
          ''',
              "keyboard end-turn gate",
          )

      - name: Commit and self-remove
        run: |
          git rm .github/workflows/temporary-game-over-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add C7Engine/EntryPoints/MessageToEngine.cs C7Engine/EngineStorage.cs C7Engine/EntryPoints/MessageToUI.cs C7Engine/EntryPoints/TurnHandling.cs C7/Game.cs
          git commit -m "Stop gameplay mutations after recorded victory"
          git push origin HEAD:agent/game-over-state
