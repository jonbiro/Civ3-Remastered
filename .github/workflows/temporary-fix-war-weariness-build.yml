name: Temporary fix war-weariness build

on:
  push:
    branches:
      - agent/war-weariness-implementation
    paths:
      - .github/workflows/temporary-fix-war-weariness-build.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/war-weariness-implementation
          fetch-depth: 0

      - name: Replace obsolete test fixture reference
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("EngineTests/Compatibility/WarWearinessCompatibilityTest.cs")
          text = path.read_text()
          old = "\t\tMultiTurnDeal peace = PlayerRelationship.DEFAULT_PEACE;"
          new = "\t\tMultiTurnDeal peace = new(DealType.DiplomaticAgreement, DealSubType.Peace, DealDetails.Exchange);"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one obsolete fixture reference, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/temporary-fix-war-weariness-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix war-weariness peace fixture"
          git push origin HEAD:agent/war-weariness-implementation
