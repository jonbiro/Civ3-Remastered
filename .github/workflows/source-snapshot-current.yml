name: Temporary current source snapshot

on:
  pull_request:
    branches:
      - agent/civ3-install-integration

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6

      - name: Archive source
        run: tar --exclude=.git -czf ../civ3-remastered-current.tar.gz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: civ3-remastered-current
          path: ../civ3-remastered-current.tar.gz
          if-no-files-found: error
          retention-days: 1
