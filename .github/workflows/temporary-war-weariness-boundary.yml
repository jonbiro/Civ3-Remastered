name: Temporary war-weariness boundary patch

on:
  push:
    branches:
      - agent/war-weariness-implementation
    paths:
      - .github/workflows/temporary-war-weariness-boundary.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout war-weariness branch
        uses: actions/checkout@v6
        with:
          ref: agent/war-weariness-implementation
          fetch-depth: 0

      - name: Apply verified boundary patch
        run: |
          cat scripts/war-weariness-boundary.patch.b64 | tr -d '\r\n' | base64 --decode > /tmp/war-weariness-boundary.patch
          echo "a00032ebe680dc60cc38a3131663eab8e602fa59bd2c000958fd60dd31549b6d  /tmp/war-weariness-boundary.patch" | sha256sum --check
          git apply --check /tmp/war-weariness-boundary.patch
          git apply /tmp/war-weariness-boundary.patch
          git rm scripts/war-weariness-boundary.patch.b64 .github/workflows/temporary-war-weariness-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align Civ III peace decay boundary sequence"
          git push origin HEAD:agent/war-weariness-implementation

# Existing workflow trigger commit.
